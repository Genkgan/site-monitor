<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Site Monitor">
<title>Site Monitor</title>

<style>
:root{
  --bg:#f2f2f7;
  --card:#fff;
  --text:#111;
  --muted:#777;
  --line:#e5e5ea;
  --green:#34c759;
  --red:#ff3b30;
  --blue:#007aff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif
}
button,input,textarea{font-family:inherit}
button{
  border:0;
  border-radius:13px;
  padding:13px 12px;
  font-size:15px;
  font-weight:750;
  min-height:48px;
  cursor:pointer
}
button:active{transform:scale(.98);opacity:.85}
input,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  font-size:15px;
  background:#fafafa;
  outline:none
}
input:focus,textarea:focus{
  border-color:#9ecaff;
  background:#fff
}
textarea{min-height:76px;resize:vertical}

/* 認証画面 */
#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(20px + env(safe-area-inset-top))
    18px
    calc(20px + env(safe-area-inset-bottom))
}
.authBox{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:24px;
  padding:26px 20px;
  box-shadow:0 8px 35px #00000012
}
.authLogo{
  width:64px;
  height:64px;
  border-radius:18px;
  background:#007aff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin:0 auto 18px
}
.authTitle{
  text-align:center;
  font-size:27px;
  font-weight:800;
  margin-bottom:7px
}
.authSub{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:25px
}
.authLabel{
  display:block;
  font-size:13px;
  color:#666;
  font-weight:700;
  margin-bottom:7px
}
#accessKey{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.2px
}
.authButton{
  width:100%;
  margin-top:14px;
  background:var(--blue);
  color:#fff
}
.authError{
  min-height:20px;
  color:var(--red);
  font-size:13px;
  font-weight:700;
  text-align:center;
  margin-top:12px
}
.authInfo{
  text-align:center;
  color:#999;
  font-size:11px;
  margin-top:22px
}

/* メイン */
#mainApp{display:none}
.app{
  max-width:680px;
  margin:auto;
  padding:
    calc(16px + env(safe-area-inset-top))
    14px
    calc(28px + env(safe-area-inset-bottom))
}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:4px 4px 16px
}
h1{
  font-size:27px;
  margin:0;
  font-weight:800
}
.badge{
  font-size:12px;
  font-weight:700;
  padding:7px 10px;
  border-radius:999px;
  background:#e5e5ea;
  color:#555
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  margin:0 0 14px;
  box-shadow:0 1px 4px #0000000d
}
.status{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:750
}
.dot{
  width:13px;
  height:13px;
  border-radius:50%;
  background:#8e8e93
}
.dot.on{
  background:var(--green);
  box-shadow:0 0 0 4px #34c75922
}
.dot.off{background:var(--red)}
.small{
  font-size:12px;
  color:var(--muted)
}
label{
  display:block;
  font-size:13px;
  color:#666;
  font-weight:600;
  margin:14px 0 6px
}
.row{
  display:flex;
  gap:10px
}
.row button{flex:1}
.start{
  background:var(--green);
  color:#fff
}
.stop{
  background:var(--red);
  color:#fff
}
.blue{
  background:var(--blue);
  color:#fff
}
.gray{
  background:#e5e5ea;
  color:#111
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.box{
  background:var(--bg);
  border-radius:13px;
  padding:12px;
  min-height:70px
}
.box .t{
  font-size:12px;
  color:var(--muted)
}
.box .v{
  margin-top:5px;
  font-weight:750;
  word-break:break-word
}
.sectionTitle{
  font-weight:750;
  margin-bottom:11px
}
.log{
  height:280px;
  background:#101010;
  color:#e9e9e9;
  border-radius:13px;
  padding:12px;
  overflow:auto;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap
}
.log .ok{color:#72e89a}
.log .err{color:#ff6b61}
.log .info{color:#d7d7d7}
.logout{
  width:100%;
  margin-top:10px;
  background:#e5e5ea;
  color:#111
}
.toast{
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  opacity:0;
  background:#222;
  color:#fff;
  padding:11px 15px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  pointer-events:none;
  transition:.2s;
  z-index:10
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}
</style>
</head>

<body>

<!-- =========================
     利用者Key認証
========================= -->

<div id="authScreen">

  <div class="authBox">

    <div class="authLogo">🔐</div>

    <div class="authTitle">
      Site Monitor
    </div>

    <div class="authSub">
      利用者Keyを入力してください
    </div>

    <label class="authLabel" for="accessKey">
      利用者Key
    </label>

    <input
      id="accessKey"
      type="password"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="key-xxxxxxxx"
      onkeydown="if(event.key==='Enter')login()"
    >

    <button
      class="authButton"
      onclick="login()"
    >
      🔑 接続
    </button>

    <div id="authError" class="authError"></div>

    <div class="authInfo">
      Site Monitor
    </div>

  </div>

</div>


<!-- =========================
     Site Monitor本体
========================= -->

<div id="mainApp">

<div class="app">

  <div class="header">

    <h1>Site Monitor</h1>

    <div id="modeBadge" class="badge">
      iPhone側のみ
    </div>

  </div>


  <div class="card">

    <div class="status">

      <div id="dot" class="dot off"></div>

      <div>

        <div id="statusText">
          停止中
        </div>

        <div id="statusSub" class="small">
          監視エンジン未接続
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <div class="sectionTitle">
      監視設定
    </div>


    <label for="url">
      監視URL
    </label>

    <input
      id="url"
      type="url"
      placeholder="https://example.com"
    >


    <label for="interval">
      監視間隔（秒）
    </label>

    <input
      id="interval"
      type="number"
      min="0.5"
      step="0.1"
      value="5"
    >


    <label for="webhook">
      Discord Webhook
    </label>

    <input
      id="webhook"
      type="text"
      placeholder="後から設定できます"
    >


    <label for="inKeywords">
      INキーワード（1行1個）
    </label>

    <textarea
      id="inKeywords"
      placeholder="在庫あり&#10;購入する&#10;カートに入れる"
    ></textarea>


    <label for="outKeywords">
      OUTキーワード（1行1個）
    </label>

    <textarea
      id="outKeywords"
      placeholder="SOLD OUT&#10;完売&#10;在庫切れ"
    ></textarea>


    <label for="queueKeywords">
      Queueキーワード（1行1個）
    </label>

    <textarea
      id="queueKeywords"
      placeholder="Waiting Room&#10;Queue-it&#10;待機室"
    ></textarea>


    <label for="errorKeywords">
      エラーキーワード（1行1個）
    </label>

    <textarea
      id="errorKeywords"
      placeholder="403&#10;404&#10;500&#10;Access Denied"
    ></textarea>

  </div>


  <div class="card">

    <div class="row">

      <button
        class="start"
        onclick="startUI()"
      >
        ▶ 開始
      </button>

      <button
        class="stop"
        onclick="stopUI()"
      >
        ■ 停止
      </button>

    </div>

    <div style="height:10px"></div>

    <div class="row">

      <button
        class="gray"
        onclick="saveSettings()"
      >
        💾 設定保存
      </button>

      <button
        class="blue"
        onclick="testDiscord()"
      >
        🔔 Discordテスト
      </button>

    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      🔒 ログアウト
    </button>

  </div>


  <div class="card">

    <div class="sectionTitle">
      状態
    </div>

    <div class="grid">

      <div class="box">
        <div class="t">現在状態</div>
        <div id="current" class="v">未確認</div>
      </div>

      <div class="box">
        <div class="t">チェック回数</div>
        <div id="count" class="v">0</div>
      </div>

      <div class="box">
        <div class="t">最終チェック</div>
        <div id="last" class="v">---</div>
      </div>

      <div class="box">
        <div class="t">次回チェック</div>
        <div id="next" class="v">---</div>
      </div>

    </div>

  </div>


  <div class="card">

    <div class="sectionTitle">
      📋 ログ
    </div>

    <div id="log" class="log"></div>

    <div style="height:10px"></div>

    <button
      class="gray"
      onclick="clearLog()"
    >
      ログを消去
    </button>

  </div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================
   擬似利用者Key
   後でサーバー認証に変更する
========================================= */

const DEMO_USER_KEY =
  "key-demo-site-monitor-001";

const AUTH_KEY =
  "siteMonitor_authenticated_v1";

const SETTINGS_KEY =
  "siteMonitor_ui_v2";

let running = false;
let timer = null;
let count = 0;


/* =========================================
   共通
========================================= */

const $ = id =>
  document.getElementById(id);

function now(){

  return new Date().toLocaleTimeString(
    "ja-JP",
    {
      hour12:false
    }
  );

}


/* =========================================
   Toast
========================================= */

function toast(msg){

  const t = $("toast");

  t.textContent = msg;

  t.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast =
    setTimeout(
      () => t.classList.remove("show"),
      1600
    );

}


/* =========================================
   ログ
========================================= */

function addLog(msg, cls="info"){

  const d =
    document.createElement("div");

  d.className = cls;

  d.textContent =
    `[${now()}] ${msg}`;

  $("log").appendChild(d);

  $("log").scrollTop =
    $("log").scrollHeight;

}


/* =========================================
   Keyログイン
========================================= */

function login(){

  const input =
    $("accessKey").value.trim();

  const error =
    $("authError");

  error.textContent = "";


  if(!input){

    error.textContent =
      "Keyを入力してください";

    return;

  }


  if(input !== DEMO_USER_KEY){

    error.textContent =
      "Keyが無効です";

    $("accessKey").value = "";

    return;

  }


  localStorage.setItem(
    AUTH_KEY,
    "1"
  );


  $("authScreen").style.display =
    "none";

  $("mainApp").style.display =
    "block";


  addLog(
    "利用者Keyの認証に成功しました",
    "ok"
  );

  toast(
    "認証しました"
  );

}


/* =========================================
   ログアウト
========================================= */

function logout(){

  stopUI();

  localStorage.removeItem(
    AUTH_KEY
  );

  $("mainApp").style.display =
    "none";

  $("authScreen").style.display =
    "flex";

  $("accessKey").value = "";

  $("authError").textContent = "";

  toast(
    "ログアウトしました"
  );

}


/* =========================================
   認証状態確認
========================================= */

function checkAuth(){

  const authenticated =
    localStorage.getItem(
      AUTH_KEY
    ) === "1";


  if(authenticated){

    $("authScreen").style.display =
      "none";

    $("mainApp").style.display =
      "block";

  }else{

    $("authScreen").style.display =
      "flex";

    $("mainApp").style.display =
      "none";

  }

}


/* =========================================
   ステータス
========================================= */

function setStatus(on){

  $("dot").className =
    "dot " +
    (on ? "on" : "off");

  $("statusText").textContent =
    on ? "監視中" : "停止中";

  $("statusSub").textContent =
    on
      ? "iPhone側UIは稼働中"
      : "監視エンジン未接続";

}


/* =========================================
   設定取得
========================================= */

function getSettings(){

  return {

    url:
      $("url").value.trim(),

    interval:
      $("interval").value,

    webhook:
      $("webhook").value.trim(),

    inKeywords:
      $("inKeywords").value,

    outKeywords:
      $("outKeywords").value,

    queueKeywords:
      $("queueKeywords").value,

    errorKeywords:
      $("errorKeywords").value

  };

}


/* =========================================
   設定保存
========================================= */

function saveSettings(show=true){

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(getSettings())
  );

  addLog(
    "設定を保存しました",
    "ok"
  );

  if(show){

    toast(
      "設定を保存しました"
    );

  }

}


/* =========================================
   設定読み込み
========================================= */

function loadSettings(){

  try{

    const d =
      JSON.parse(
        localStorage.getItem(
          SETTINGS_KEY
        ) || "null"
      );


    if(!d) return;


    $("url").value =
      d.url || "";

    $("interval").value =
      d.interval || 5;

    $("webhook").value =
      d.webhook || "";

    $("inKeywords").value =
      d.inKeywords || "";

    $("outKeywords").value =
      d.outKeywords || "";

    $("queueKeywords").value =
      d.queueKeywords || "";

    $("errorKeywords").value =
      d.errorKeywords || "";


  }catch(e){

    addLog(
      "設定の読み込みに失敗しました",
      "err"
    );

  }

}


/* =========================================
   開始
========================================= */

function startUI(){

  if(running) return;

  running = true;

  setStatus(true);

  saveSettings(false);

  addLog(
    "監視を開始しました",
    "ok"
  );

  toast(
    "開始しました"
  );

  scheduleUI();

}


/* =========================================
   停止
========================================= */

function stopUI(){

  running = false;

  if(timer){

    clearTimeout(timer);

    timer = null;

  }

  $("next").textContent =
    "停止";

  setStatus(false);

  addLog(
    "監視を停止しました"
  );

}


/* =========================================
   UI監視
========================================= */

function scheduleUI(){

  if(!running) return;


  const sec =
    Math.max(
      0.5,
      Number(
        $("interval").value
      ) || 5
    );


  $("next").textContent =
    sec + " 秒後";


  timer =
    setTimeout(
      () => {

        count++;

        $("count").textContent =
          count;

        $("last").textContent =
          now();

        $("current").textContent =
          "サーバー未接続";

        addLog(
          "UIチェック #" +
          count +
          "（Windowsサーバー未接続）"
        );

        scheduleUI();

      },
      sec * 1000
    );

}


/* =========================================
   Discordテスト
========================================= */

async function testDiscord(){

  const url =
    $("webhook").value.trim();


  if(!url){

    addLog(
      "Webhookが未入力です",
      "err"
    );

    toast(
      "Webhookを入力してください"
    );

    return;

  }


  if(
    !/^https:\/\/(discord\.com|discordapp\.com)\//i.test(url)
  ){

    addLog(
      "Discord Webhook URLではありません",
      "err"
    );

    toast(
      "Webhook URLを確認してください"
    );

    return;

  }


  addLog(
    "Discordテスト送信を開始"
  );


  try{

    const r =
      await fetch(
        url,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              content:
                "🔔 Site Monitor テスト通知"
            })
        }
      );


    if(r.ok){

      addLog(
        "Discordテスト送信成功",
        "ok"
      );

      toast(
        "Discord送信成功"
      );

    }else{

      addLog(
        "Discord送信失敗 HTTP " +
        r.status,
        "err"
      );

      toast(
        "Discord送信失敗"
      );

    }


  }catch(e){

    addLog(
      "Discord送信エラー（iPhone側の通信制限等）",
      "err"
    );

    toast(
      "送信できませんでした"
    );

  }

}


/* =========================================
   ログ消去
========================================= */

function clearLog(){

  $("log").innerHTML = "";

  addLog(
    "ログを消去しました"
  );

}


/* =========================================
   初期化
========================================= */

loadSettings();

setStatus(false);

checkAuth();

</script>

</body>
</html>
